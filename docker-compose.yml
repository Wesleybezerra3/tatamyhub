services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tatamyhub-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - tatamyhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: tatamyhub-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Aplicação web acessível no navegador em http://localhost:5173
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - tatamyhub-network

volumes:
  uploads_data:
    name: tatamyhub_uploads_data

networks:
  tatamyhub-network:
    name: tatamyhub_network
    driver: bridge
