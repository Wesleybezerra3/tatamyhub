services:
  db:
    image: mysql:8.0
    container_name: tatamyhub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Wes1018m.}
      MYSQL_DATABASE: ${DB_NAME:-mvp}
      MYSQL_USER: ${DB_USER:-tatamy_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Wes1018m.}
    ports:
      # Porta externa 3307 mapeada para a porta interna 3306 do MySQL
      # (evita conflito com instâncias locais do MySQL já rodando na porta 3306)
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tatamyhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Wes1018m.}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tatamyhub-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Wes1018m.}
      DB_NAME: ${DB_NAME:-mvp}
      JWT_SECRET: ${JWT_SECRET:-tatamyhub_super_secret_jwt_key_2026_change_in_production}
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - tatamyhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: tatamyhub-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Aplicação web acessível no navegador em http://localhost:5173
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - tatamyhub-network

volumes:
  mysql_data:
    name: tatamyhub_mysql_data
  uploads_data:
    name: tatamyhub_uploads_data

networks:
  tatamyhub-network:
    name: tatamyhub_network
    driver: bridge
