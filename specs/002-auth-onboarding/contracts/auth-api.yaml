openapi: 3.0.3
info:
  title: TatamyHub - API de Autenticação e Onboarding
  description: Endpoints para registro de academia com gestor, login com JWT e verificação de sessão.
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      summary: Realiza o cadastro do gestor e onboarding da academia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - senha
                - nome_academia
              properties:
                nome:
                  type: string
                  example: Mestre Carlos Silva
                email:
                  type: string
                  format: email
                  example: carlos@tatamebjj.com
                senha:
                  type: string
                  minLength: 6
                  example: senhaForte123
                nome_academia:
                  type: string
                  example: Tatame BJJ Club
                whatsapp:
                  type: string
                  example: (11) 99999-8888
                modalidade_inicial:
                  type: string
                  example: Jiu-Jitsu
      responses:
        '201':
          description: Conta e academia criadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conta criada com sucesso! Faça login para acessar.
                  email:
                    type: string
                    example: carlos@tatamebjj.com
        '400':
          description: Dados inválidos, senha fraca ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Autentica o usuário e retorna o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  format: email
                  example: carlos@tatamebjj.com
                senha:
                  type: string
                  example: senhaForte123
      responses:
        '200':
          description: Autenticação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  academia:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      logo_url:
                        type: string
                        nullable: true
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      summary: Retorna os dados do usuário autenticado a partir do token JWT
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados da sessão recuperados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  academia:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      logo_url:
                        type: string
                        nullable: true
        '401':
          description: Token não fornecido ou inválido

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
        academia_id:
          type: integer
        nome:
          type: string
        email:
          type: string
        role:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: E-mail ou senha incorretos.
